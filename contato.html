<!DOCTYPE html>

    <!-- =====================================================================
         PÁGINA PÚBLICA DE CONTATO — DESTINO DE EMERGÊNCIA DOS QR CODES

         Esta página é o FALLBACK de /r/<slug> (ver r.html). Ela é aberta
         quando o backend não responde, o slug foi desativado ou o visitante
         está com o JavaScript desligado.

         Por isso ela precisa ser:
           - 100% ESTÁTICA: nenhuma chamada de API, nenhum script externo,
             nenhum CDN. Se o backend caiu, esta página tem que continuar
             de pé sozinha no Firebase Hosting.
           - PÚBLICA: quem chega aqui é um cliente que apontou o celular
             para um panfleto impresso, NÃO um funcionário. Nunca coloque
             link de login, área interna ou qualquer coisa do sistema
             operante nesta página.
         ===================================================================== -->

        }
        .logo {
            width: 132px;
            height: 132px;
            object-fit: contain;
            margin: 0 auto 18px;
            display: block;
        }
        h1 {

            line-height: 1.2;
            margin: 0 0 10px;

        }
        .tagline {
            font-size: 15px;
            line-height: 1.55;

        }

            line-height: 1.55;
            margin: 26px 0 20px;
            font-weight: 600;
        }
        .btn {

            padding: 16px 20px;
            margin-bottom: 12px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;

        .btn:active { transform: scale(0.985); }
        .btn-whats {
            background: #25d366;
            color: #fff;
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.32);
        }
        .btn-tel {
            background: #fff;
            color: #3c4257;
            border: 1.5px solid #d9dce3;
        }
        .btn svg { flex: 0 0 auto; }
        .numero {
            font-size: 14px;
            margin: 18px 0 0;
            opacity: 0.7;
        }
        @media (prefers-color-scheme: dark) {
            html, body { background: #14161b; color: #c9ced9; }
            .btn-tel { background: #1c1f26; color: #c9ced9; border-color: #2b303a; }

</head>
